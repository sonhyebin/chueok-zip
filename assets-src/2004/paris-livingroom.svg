<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <radialGradient id="room" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#41364c"/>
      <stop offset="60%" stop-color="#2b2236"/>
      <stop offset="100%" stop-color="#191320"/>
    </radialGradient>
    <radialGradient id="tvGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffd9c4"/>
      <stop offset="45%" stop-color="#f2a98e"/>
      <stop offset="100%" stop-color="#a35f7a"/>
    </radialGradient>
    <linearGradient id="tvBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4148"/>
      <stop offset="100%" stop-color="#2b252c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c4530"/>
      <stop offset="100%" stop-color="#33251a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.45  0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#room)"/>

  <!-- curtain hint left -->
  <rect x="0" y="0" width="180" height="900" fill="#241b2e" filter="url(#soft)"/>
  <rect x="60" y="0" width="40" height="880" fill="#2e2340" opacity="0.7" filter="url(#soft)"/>

  <!-- floor -->
  <rect x="0" y="820" width="1600" height="380" fill="url(#floor)"/>
  <!-- TV light pool on floor -->
  <ellipse cx="800" cy="900" rx="560" ry="130" fill="#f2a98e" opacity="0.32" filter="url(#soft2)"/>

  <!-- TV cabinet -->
  <rect x="470" y="700" width="660" height="150" rx="10" fill="#3c2c1d"/>
  <rect x="470" y="700" width="660" height="16" rx="8" fill="#54402c"/>
  <rect x="520" y="740" width="150" height="70" rx="6" fill="#2a1e13"/>
  <rect x="930" y="740" width="150" height="70" rx="6" fill="#2a1e13"/>
  <!-- videotapes on shelf -->
  <rect x="700" y="748" width="26" height="62" rx="3" fill="#1d1721"/>
  <rect x="730" y="748" width="26" height="62" rx="3" fill="#262030"/>
  <rect x="760" y="748" width="26" height="62" rx="3" fill="#1d1721"/>

  <!-- CRT TV -->
  <g>
    <rect x="500" y="330" width="600" height="400" rx="26" fill="url(#tvBody)"/>
    <rect x="500" y="330" width="600" height="400" rx="26" fill="none" stroke="#171219" stroke-width="5"/>
    <!-- screen: warm romantic light, abstract silhouettes only -->
    <rect x="540" y="365" width="470" height="330" rx="30" fill="url(#tvGlow)"/>
    <!-- abstract two silhouettes on screen (non-identifiable) -->
    <g opacity="0.26" fill="#5c2b3d" filter="url(#soft)">
      <ellipse cx="700" cy="580" rx="58" ry="95"/>
      <circle cx="700" cy="470" r="32"/>
      <ellipse cx="835" cy="588" rx="62" ry="88"/>
      <circle cx="835" cy="482" r="30"/>
    </g>
    <ellipse cx="770" cy="430" rx="220" ry="80" fill="#ffe9d4" opacity="0.35" filter="url(#soft)"/>
    <!-- screen sheen -->
    <ellipse cx="660" cy="430" rx="130" ry="60" fill="#ffffff" opacity="0.18" filter="url(#soft)"/>
    <!-- speaker strip right -->
    <rect x="1030" y="380" width="46" height="300" rx="8" fill="#241e25"/>
    <g fill="#3a323b">
      <circle cx="1053" cy="410" r="10"/><circle cx="1053" cy="440" r="10"/><circle cx="1053" cy="470" r="10"/>
      <rect x="1038" y="560" width="30" height="8" rx="4"/><rect x="1038" y="580" width="30" height="8" rx="4"/>
    </g>
    <circle cx="1053" cy="640" r="12" fill="#171219"/>
    <!-- glow spill around tv -->
    <ellipse cx="775" cy="530" rx="420" ry="300" fill="#f2a98e" opacity="0.17" filter="url(#soft2)"/>
  </g>

  <!-- viewers from behind, sitting on floor -->
  <g>
    <!-- person 1: long hair, blanket -->
    <g transform="translate(560,830)">
      <path d="M0 240 q-20 -140 30 -196 q20 -60 80 -60 q60 0 80 62 q46 58 28 194 z" fill="#181320"/>
      <circle cx="110" cy="-20" r="62" fill="#100c16"/>
      <path d="M48 -20 q62 -78 124 0 l8 90 q-70 26 -140 0 z" fill="#100c16"/>
      <!-- blanket -->
      <path d="M-30 240 q10 -90 60 -110 l160 0 q50 24 58 110 z" fill="#5a3a4c"/>
      <path d="M-30 240 q10 -90 60 -110 l160 0 q50 24 58 110 z" fill="none" stroke="#6d4a5e" stroke-width="6" stroke-dasharray="2 26"/>
    </g>
    <!-- person 2: short hair, leaning -->
    <g transform="translate(880,860) rotate(4)">
      <path d="M0 210 q-14 -120 26 -168 q18 -52 72 -52 q54 0 72 54 q40 50 24 166 z" fill="#1f1929"/>
      <circle cx="98" cy="-14" r="54" fill="#161020"/>
      <path d="M46 -20 q52 -62 104 0 l0 44 q-52 20 -104 0 z" fill="#161020"/>
    </g>
  </g>

  <!-- floor props: tangerine bowl + remote -->
  <g transform="translate(300,1000)">
    <ellipse cx="0" cy="30" rx="110" ry="34" fill="#241a10"/>
    <path d="M-100 18 q0 40 100 40 q100 0 100 -40 z" fill="#8a6a4a"/>
    <circle cx="-40" cy="6" r="26" fill="#e8853a"/>
    <circle cx="8" cy="-2" r="27" fill="#f09545"/>
    <circle cx="52" cy="8" r="25" fill="#db7c33"/>
    <circle cx="8" cy="-2" r="4" fill="#5d8a3a"/>
  </g>
  <g transform="translate(1240,1020) rotate(18)">
    <rect width="70" height="190" rx="16" fill="#2e2833"/>
    <g fill="#4a4152">
      <circle cx="35" cy="40" r="10"/>
      <rect x="16" y="66" width="16" height="16" rx="4"/><rect x="40" y="66" width="16" height="16" rx="4"/>
      <rect x="16" y="90" width="16" height="16" rx="4"/><rect x="40" y="90" width="16" height="16" rx="4"/>
      <rect x="16" y="114" width="40" height="14" rx="7"/>
      <rect x="16" y="136" width="40" height="14" rx="7"/>
    </g>
  </g>

  <!-- vignette + grain -->
  <radialGradient id="vig" cx="50%" cy="45%" r="75%">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
  </radialGradient>
  <rect width="1600" height="1200" fill="url(#vig)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.3"/>
</svg>
