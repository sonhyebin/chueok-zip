<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <radialGradient id="roomLight" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3d3630"/>
      <stop offset="55%" stop-color="#241f1c"/>
      <stop offset="100%" stop-color="#120f0d"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="70%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f2d383"/>
    </radialGradient>
    <linearGradient id="crtBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d2c2"/>
      <stop offset="60%" stop-color="#b8b1a0"/>
      <stop offset="100%" stop-color="#8f887a"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4f35"/>
      <stop offset="100%" stop-color="#402d1c"/>
    </linearGradient>
    <linearGradient id="winTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#f5b91e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- room -->
  <rect width="1600" height="1200" fill="url(#roomLight)"/>
  <!-- wall poster shapes, blurred -->
  <rect x="1180" y="90" width="260" height="340" rx="6" fill="#4a4038" filter="url(#soft)"/>
  <rect x="1210" y="130" width="200" height="120" rx="4" fill="#5d5145" filter="url(#soft)"/>
  <circle cx="1310" cy="330" r="46" fill="#6a5b4a" filter="url(#soft)"/>
  <!-- warm desk lamp glow, right -->
  <ellipse cx="1330" cy="760" rx="360" ry="300" fill="#ff9c3f" opacity="0.18" filter="url(#soft2)"/>

  <!-- desk -->
  <rect x="0" y="880" width="1600" height="320" fill="url(#deskWood)"/>
  <rect x="0" y="880" width="1600" height="14" fill="#7d5f41"/>

  <!-- CRT monitor -->
  <g>
    <rect x="270" y="150" width="880" height="700" rx="38" fill="url(#crtBody)"/>
    <rect x="270" y="150" width="880" height="700" rx="38" fill="none" stroke="#6f695c" stroke-width="4"/>
    <!-- screen bezel -->
    <rect x="330" y="205" width="760" height="560" rx="18" fill="#2a2620"/>
    <!-- screen -->
    <rect x="352" y="225" width="716" height="520" rx="10" fill="url(#screenGlow)"/>
    <!-- desktop background inside screen: pastel sky wallpaper feel -->
    <rect x="352" y="225" width="716" height="520" rx="10" fill="#bfe3ef"/>
    <ellipse cx="520" cy="330" rx="90" ry="34" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="900" cy="290" rx="70" ry="26" fill="#ffffff" opacity="0.7"/>
    <rect x="352" y="700" width="716" height="45" fill="#d8d2c2"/>
    <rect x="368" y="710" width="90" height="26" rx="4" fill="#f5b91e"/>
    <rect x="470" y="712" width="60" height="22" rx="3" fill="#c3bcab"/>

    <!-- original messenger window (yellow-toned, NOT BuddyBuddy layout) -->
    <g>
      <rect x="470" y="270" width="360" height="410" rx="10" fill="#fffbe8" stroke="#d9a512" stroke-width="3"/>
      <rect x="470" y="270" width="360" height="46" rx="10" fill="url(#winTitle)"/>
      <rect x="470" y="300" width="360" height="16" fill="#f5b91e"/>
      <circle cx="497" cy="293" r="9" fill="#fff3c2"/>
      <rect x="778" y="284" width="16" height="16" rx="3" fill="#fff3c2"/>
      <rect x="800" y="284" width="16" height="16" rx="3" fill="#e88f2a"/>
      <!-- buddy rows: smiley dot + blurred name bar + status dot -->
      <g font-family="sans-serif">
        <g transform="translate(0,0)">
          <circle cx="502" cy="348" r="12" fill="#ffd24d" stroke="#d9a512" stroke-width="2"/>
          <circle cx="497" cy="345" r="1.8" fill="#5e4a10"/><circle cx="507" cy="345" r="1.8" fill="#5e4a10"/>
          <path d="M496 352 q6 5 12 0" stroke="#5e4a10" stroke-width="2" fill="none"/>
          <rect x="525" y="340" width="150" height="14" rx="7" fill="#e8d9a0"/>
          <circle cx="800" cy="348" r="6" fill="#7fc242"/>
        </g>
        <g transform="translate(0,44)">
          <circle cx="502" cy="348" r="12" fill="#ffd24d" stroke="#d9a512" stroke-width="2"/>
          <circle cx="497" cy="345" r="1.8" fill="#5e4a10"/><circle cx="507" cy="345" r="1.8" fill="#5e4a10"/>
          <path d="M496 352 q6 5 12 0" stroke="#5e4a10" stroke-width="2" fill="none"/>
          <rect x="525" y="340" width="180" height="14" rx="7" fill="#e8d9a0"/>
          <circle cx="800" cy="348" r="6" fill="#7fc242"/>
        </g>
        <g transform="translate(0,88)">
          <circle cx="502" cy="348" r="12" fill="#ffe9a8" stroke="#d9a512" stroke-width="2"/>
          <circle cx="497" cy="345" r="1.8" fill="#8a7a4a"/><circle cx="507" cy="345" r="1.8" fill="#8a7a4a"/>
          <path d="M496 353 h12" stroke="#8a7a4a" stroke-width="2" fill="none"/>
          <rect x="525" y="340" width="130" height="14" rx="7" fill="#efe4bb"/>
          <circle cx="800" cy="348" r="6" fill="#c9c1a8"/>
        </g>
        <g transform="translate(0,132)">
          <circle cx="502" cy="348" r="12" fill="#ffd24d" stroke="#d9a512" stroke-width="2"/>
          <circle cx="497" cy="345" r="1.8" fill="#5e4a10"/><circle cx="507" cy="345" r="1.8" fill="#5e4a10"/>
          <path d="M496 352 q6 5 12 0" stroke="#5e4a10" stroke-width="2" fill="none"/>
          <rect x="525" y="340" width="165" height="14" rx="7" fill="#e8d9a0"/>
          <circle cx="800" cy="348" r="6" fill="#7fc242"/>
        </g>
        <g transform="translate(0,176)">
          <circle cx="502" cy="348" r="12" fill="#ffe9a8" stroke="#d9a512" stroke-width="2"/>
          <circle cx="497" cy="345" r="1.8" fill="#8a7a4a"/><circle cx="507" cy="345" r="1.8" fill="#8a7a4a"/>
          <path d="M496 353 h12" stroke="#8a7a4a" stroke-width="2" fill="none"/>
          <rect x="525" y="340" width="140" height="14" rx="7" fill="#efe4bb"/>
          <circle cx="800" cy="348" r="6" fill="#c9c1a8"/>
        </g>
        <g transform="translate(0,220)">
          <circle cx="502" cy="348" r="12" fill="#ffd24d" stroke="#d9a512" stroke-width="2"/>
          <circle cx="497" cy="345" r="1.8" fill="#5e4a10"/><circle cx="507" cy="345" r="1.8" fill="#5e4a10"/>
          <path d="M496 352 q6 5 12 0" stroke="#5e4a10" stroke-width="2" fill="none"/>
          <rect x="525" y="340" width="120" height="14" rx="7" fill="#e8d9a0"/>
          <circle cx="800" cy="348" r="6" fill="#7fc242"/>
        </g>
      </g>
      <!-- bottom bar of window -->
      <rect x="486" y="622" width="328" height="40" rx="8" fill="#fff3c2" stroke="#e0cf9a" stroke-width="2"/>
      <circle cx="512" cy="642" r="10" fill="#f5b91e"/>
      <rect x="534" y="636" width="200" height="12" rx="6" fill="#efe4bb"/>
    </g>

    <!-- small chat popup window overlapping -->
    <g>
      <rect x="640" y="480" width="300" height="230" rx="10" fill="#fffdf4" stroke="#d9a512" stroke-width="3"/>
      <rect x="640" y="480" width="300" height="38" rx="10" fill="url(#winTitle)"/>
      <rect x="640" y="504" width="300" height="14" fill="#f5b91e"/>
      <circle cx="663" cy="499" r="8" fill="#fff3c2"/>
      <!-- chat bubbles: blurred text bars -->
      <rect x="662" y="536" width="150" height="26" rx="13" fill="#ffeeb0"/>
      <rect x="750" y="574" width="168" height="26" rx="13" fill="#e4efc9"/>
      <rect x="662" y="612" width="120" height="26" rx="13" fill="#ffeeb0"/>
      <rect x="662" y="662" width="230" height="30" rx="6" fill="#f4efdc" stroke="#e3d9b4" stroke-width="2"/>
      <rect x="900" y="662" width="30" height="30" rx="6" fill="#f5b91e"/>
    </g>

    <!-- screen glow spill -->
    <rect x="352" y="225" width="716" height="520" rx="10" fill="#fff6d8" opacity="0.10"/>
    <!-- monitor foot -->
    <rect x="620" y="850" width="180" height="46" rx="10" fill="#8f887a"/>
    <rect x="560" y="892" width="300" height="26" rx="12" fill="#6f695c"/>
  </g>

  <!-- glow cast on desk from screen -->
  <ellipse cx="710" cy="930" rx="430" ry="70" fill="#ffe9a8" opacity="0.20" filter="url(#soft2)"/>

  <!-- keyboard -->
  <g transform="translate(430,960) rotate(-2)">
    <rect width="560" height="150" rx="14" fill="#cfc9b8"/>
    <rect x="10" y="10" width="540" height="130" rx="10" fill="#bdb6a4"/>
    <g fill="#e6e0cf">
      <rect x="24" y="22" width="40" height="26" rx="4"/><rect x="70" y="22" width="40" height="26" rx="4"/><rect x="116" y="22" width="40" height="26" rx="4"/><rect x="162" y="22" width="40" height="26" rx="4"/><rect x="208" y="22" width="40" height="26" rx="4"/><rect x="254" y="22" width="40" height="26" rx="4"/><rect x="300" y="22" width="40" height="26" rx="4"/><rect x="346" y="22" width="40" height="26" rx="4"/><rect x="392" y="22" width="40" height="26" rx="4"/><rect x="438" y="22" width="40" height="26" rx="4"/><rect x="484" y="22" width="48" height="26" rx="4"/>
      <rect x="24" y="54" width="46" height="26" rx="4"/><rect x="76" y="54" width="40" height="26" rx="4"/><rect x="122" y="54" width="40" height="26" rx="4"/><rect x="168" y="54" width="40" height="26" rx="4"/><rect x="214" y="54" width="40" height="26" rx="4"/><rect x="260" y="54" width="40" height="26" rx="4"/><rect x="306" y="54" width="40" height="26" rx="4"/><rect x="352" y="54" width="40" height="26" rx="4"/><rect x="398" y="54" width="40" height="26" rx="4"/><rect x="444" y="54" width="88" height="26" rx="4"/>
      <rect x="24" y="86" width="56" height="26" rx="4"/><rect x="86" y="86" width="40" height="26" rx="4"/><rect x="132" y="86" width="40" height="26" rx="4"/><rect x="178" y="86" width="40" height="26" rx="4"/><rect x="224" y="86" width="40" height="26" rx="4"/><rect x="270" y="86" width="40" height="26" rx="4"/><rect x="316" y="86" width="40" height="26" rx="4"/><rect x="362" y="86" width="40" height="26" rx="4"/><rect x="408" y="86" width="124" height="26" rx="4"/>
      <rect x="90" y="118" width="330" height="16" rx="4"/>
    </g>
  </g>

  <!-- mouse -->
  <g transform="translate(1060,1000) rotate(8)">
    <ellipse cx="0" cy="0" rx="46" ry="64" fill="#d8d2c2"/>
    <line x1="0" y1="-64" x2="0" y2="-20" stroke="#b0a996" stroke-width="3"/>
    <path d="M-8 -64 C -30 -140 60 -120 120 -160" stroke="#8f887a" stroke-width="6" fill="none"/>
  </g>

  <!-- diary + pen, left -->
  <g transform="translate(90,970) rotate(-6)">
    <rect width="240" height="170" rx="8" fill="#b0553f"/>
    <rect x="10" y="10" width="220" height="150" rx="6" fill="#c96a52"/>
    <rect x="20" y="60" width="140" height="10" rx="5" fill="#e2a795" opacity="0.7"/>
    <rect x="20" y="84" width="170" height="10" rx="5" fill="#e2a795" opacity="0.5"/>
    <circle cx="196" cy="36" r="16" fill="#ffd24d"/>
  </g>
  <rect x="300" y="1060" width="130" height="12" rx="6" fill="#d8d2c2" transform="rotate(-14 300 1060)"/>

  <!-- vignette -->
  <rect width="1600" height="1200" fill="none"/>
  <radialGradient id="vig" cx="50%" cy="46%" r="75%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.30"/>
  </radialGradient>
  <rect width="1600" height="1200" fill="url(#vig)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.3"/>
</svg>
